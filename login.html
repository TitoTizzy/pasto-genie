<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — PASTO GÉNIE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/glass.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="stylesheet" href="css/pages/login.css"/>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card glass glass-lg">

      <div class="login-top">
        <div class="login-logo-wrap">
          <img src="assets/images/logo.jpeg" alt="Logo PASTO GÉNIE"
               onerror="this.style.display='none';document.getElementById('logo-fb').style.display='flex'"/>
          <div id="logo-fb" class="login-logo-fallback" style="display:none;">✝️</div>
        </div>
        <h1 class="login-title">PASTO GÉNIE</h1>
        <p class="login-subtitle">Tournoi Paroissial · Accès sécurisé</p>
      </div>

      <div id="login-error" class="login-error hidden">
        <i class="ri-error-warning-line"></i>
        <span id="login-error-msg"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email"><i class="ri-mail-line"></i> Adresse e-mail</label>
          <div class="input-icon-wrap">
            <input id="email" type="email" class="form-input"
                   placeholder="vous@exemple.com" required autocomplete="email"/>
            <i class="ri-mail-line"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password"><i class="ri-lock-line"></i> Mot de passe</label>
          <div class="input-icon-wrap" style="position:relative;">
            <input id="password" type="password" class="form-input"
                   placeholder="••••••••" required autocomplete="current-password"
                   style="padding-right:3rem;"/>
            <i class="ri-lock-line"></i>
            <button type="button" id="pwd-toggle" class="pwd-toggle">
              <i class="ri-eye-line" id="pwd-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-gold btn-xl btn-block mt-4">
          <i class="ri-login-box-line"></i>
          <span id="btn-text">Se connecter</span>
          <span id="btn-spin" class="spinner hidden" style="width:18px;height:18px;border-width:2px;margin:0;"></span>
        </button>
      </form>

      <div class="divider-text mt-4">Niveaux d'accès</div>
      <div class="login-roles">
        <span class="badge badge-muted"><i class="ri-eye-line"></i> Public</span>
        <span class="badge badge-muted"><i class="ri-user-line"></i> Membre</span>
        <span class="badge badge-gold"><i class="ri-scales-3-line"></i> Jury</span>
        <span class="badge badge-gold"><i class="ri-shield-keyhole-line"></i> Superadmin</span>
      </div>

      <p class="text-center text-xs text-muted mt-4">
        Problème d'accès ? Contactez l'administrateur du tournoi.
      </p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
